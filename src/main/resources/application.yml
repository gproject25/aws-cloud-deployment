spring:
  application:
    name: aws-cloud-deployment

  cloud:
    aws:
      region:
        static: ap-northeast-2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO