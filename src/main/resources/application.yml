spring:
  application:
    name: aws-cloud-deployment

  cloud:
    aws:
      region:
        static: ap-northeast-2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO