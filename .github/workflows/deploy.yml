
name: CI Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [level/challenge]
  #pull_request:
    #branches: [main]

# 권한 설정
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Gradle 설정 및 캐시
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # Step 5: JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # Step 6: JAR 파일 준비
      - name: Prepare JAR
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          test -n "$JAR_FILE"
          cp "$JAR_FILE" app.jar

      # Step 7: Docker 이미지 빌드 (테스트용)
      - name: Build Docker image for testing
        run: docker build -t spring-cloud-deployment:test .

      # Step 8: Spring Boot 실행 테스트
      - name: Test Docker container startup
        run: |
          docker run -d -p 8080:8080 \
            --name spring-boot-test \
            -e SPRING_PROFILES_ACTIVE=local \
            spring-cloud-deployment:test

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              echo "Spring Boot started successfully!"
              exit 0
            fi
            sleep 2
          done

          echo "Spring Boot failed to start or become healthy."
          docker logs spring-boot-test
          exit 1

      # Step 9: 테스트 컨테이너 정리
      - name: Cleanup test container
        if: always()
        run: docker rm -f spring-boot-test || true

      # Step 10: Docker Hub 로그인
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 11: Set up QEMU
      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      # Step 12: Set up Docker Buildx
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # Step 13: Docker 이미지 빌드 및 Push
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gproject25/aws-cloud-deployment:latest
            gproject25/aws-cloud-deployment:${{ github.sha }}

  # Step 14: EC2 자동 배포
  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Debug GitHub OIDC claims
        run: |
          TOKEN=$(curl -sS \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | jq -r '.value')
          
          echo "$TOKEN" | cut -d '.' -f2 | \
          tr '_-' '/+' | \
          base64 -d 2>/dev/null | \
          jq '{iss, aud, sub, repository, ref, environment}'

      # AWS 인증 (GitHub OIDC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # SSM을 통해 EC2에 배포 명령 전달
      - name: Deploy to EC2
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "sudo docker pull gproject25/aws-cloud-deployment:latest",
              "sudo docker rm -f aws-cloud-deployment || true",
              "sudo docker run -d --name aws-cloud-deployment -p 8080:8080 --restart unless-stopped -e SPRING_PROFILES_ACTIVE=prod -e AWS_REGION=ap-northeast-2 gproject25/aws-cloud-deployment:latest",
              "sudo docker ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out"
          exit 1
