
name: CI Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 권한 설정
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Gradle 설정 및 캐시
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # Step 5: JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # Step 6: JAR 파일 준비
      - name: Prepare JAR
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          test -n "$JAR_FILE"
          cp "$JAR_FILE" app.jar

      # Step 7: Docker 이미지 빌드 (테스트용)
      - name: Build Docker image for testing
        run: docker build -t spring-cloud-deployment:test .

      # Step 8: Spring Boot 실행 테스트
      - name: Test Docker container startup
        run: |
          docker run -d -p 8080:8080 \
            --name spring-boot-test \
            -e SPRING_PROFILES_ACTIVE=local \
            spring-cloud-deployment:test

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              echo "Spring Boot started successfully!"
              exit 0
            fi
            sleep 2
          done

          echo "Spring Boot failed to start or become healthy."
          docker logs spring-boot-test
          exit 1

      # Step 9: 테스트 컨테이너 정리
      - name: Cleanup test container
        if: always()
        run: docker rm -f spring-boot-test || true

      # Step 10: Docker Hub 로그인 (main push일 때만)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up QEMU for cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 11: Docker 이미지 빌드 및 Push (main push일 때만)
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gproject25/aws-cloud-deployment:latest
            gproject25/aws-cloud-deployment:${{ github.sha }}
