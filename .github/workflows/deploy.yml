name: CI/CD Pipeline

# PR: 빌드/테스트/Docker Hub 로그인 확인
# main push: 위 내용 + 이미지 push + EC2 배포
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR은 새 커밋이 오면 이전 실행을 취소
# main 배포는 실행 중인 작업을 취소하지 않음
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: gproject25/aws-cloud-deployment:${{ github.sha }}

jobs:
  build:
    name: Build, Test and Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트 + JAR 빌드
      - name: Build and test
        run: ./gradlew build

      # 이미지는 한 번만 빌드하고 테스트한 이미지를 그대로 push
      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      # 앱이 정상적으로 시작될 때까지 최대 약 60초 대기
      - name: Smoke test container
        run: |
          docker run -d -p 8080:8080 \
            --name smoke-test \
            -e SPRING_PROFILES_ACTIVE=local \
            "$IMAGE"

          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
            http://localhost:8080/actuator/health \
            || { docker logs smoke-test; exit 1; }

      # 테스트 컨테이너 정리
      - name: Cleanup test container
        if: always()
        run: docker rm -f smoke-test || true

      # 외부 fork PR에서는 Secrets에 접근할 수 없으므로 로그인 생략
      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main push에서만 이미지 push
      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      # GitHub OIDC를 사용한 AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      # SSM Run Command를 통해 Private EC2에 배포
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "docker pull ${{ env.IMAGE }}",
              "docker rm -f aws-cloud-deployment || true",
              "docker run -d --name aws-cloud-deployment -p 8080:8080 --restart unless-stopped -e SPRING_PROFILES_ACTIVE=prod -e AWS_REGION=ap-northeast-2 ${{ env.IMAGE }}",
              "docker ps",
              "curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8080/actuator/health",
              "docker image prune -af"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

        # 최대 약 5분 동안 5초마다 상태 확인
          STATUS="Pending"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                break
                ;;
            esac

            sleep 5
          done

          # 성공/실패와 관계없이 실행 로그 출력
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text

          # Success가 아니면 workflow 실패 처리
          [ "$STATUS" = "Success" ]
